services:
  rehost-gh:
    image: ghcr.io/anaisbetts/rehost-gh:latest
    restart: unless-stopped
    # Files in the bind-mounted data folder are created as this user.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Fine-grained token; see .env.example for the permissions it needs.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      # Add rehost-gh:exec to log every command run.
      DEBUG: ${DEBUG:-rehost-gh:*,-rehost-gh:exec}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:8080/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      start_interval: 5s
